[project]
name = "fintech-suite"
version = "0.2.0"
description = "Invoice automation, bank reconciliation (BRS) and contract drafting for Indian SMBs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "celery>=5.4",
  "redis>=5",
  "boto3>=1.34",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "rapidfuzz>=3.6",
  "jinja2>=3.1",
  "slowapi>=0.1.9",
  "prometheus-fastapi-instrumentator>=7",
  "structlog>=24",
  "authlib>=1.3",
  "itsdangerous>=2.1",
  "httpx>=0.27",
  "email-validator>=2.1",
  "pyhanko>=0.25",
  "cryptography>=42",
  "reportlab>=4",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6", "docling>=2.0"]
embeddings = ["sentence-transformers>=3"]
sentry = ["sentry-sdk[fastapi]>=2"]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2", "moto[s3]>=5", "aiosmtpd>=1.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["migrations", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["E501", "B007", "S101", "S608", "B008", "E701", "E702", "E731", "S105", "S314", "S405", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "B"]
"app/contracts/templates.py" = ["E501"]
"app/contracts/risk.py" = ["E501"]

# ---- architecture rules (enforced in CI: `lint-imports`) -------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers: composition roots > modules > ai > core"
type = "layers"
layers = ["app.main | app.worker", "app.modules", "app.ai", "app.core"]

[[tool.importlinter.contracts]]
name = "Feature modules are independent (talk only through declared public APIs)"
type = "independence"
modules = [
  "app.modules.identity", "app.modules.invoices", "app.modules.reconciliation",
  "app.modules.contracts", "app.modules.esign", "app.modules.legal",
]
ignore_imports = [
  "app.modules.esign.* -> app.modules.contracts.public",
  "app.modules.legal.* -> app.modules.contracts.public",
]

[[tool.importlinter.contracts]]
name = "Only contracts.public is importable from other modules"
type = "forbidden"
source_modules = ["app.modules.esign", "app.modules.legal"]
forbidden_modules = [
  "app.modules.contracts.api", "app.modules.contracts.risk", "app.modules.contracts.templates",
  "app.modules.contracts.compare", "app.modules.contracts.docx_export",
]
