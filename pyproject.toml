[project]
name = "fintech-suite"
version = "0.1.0"
description = "Invoice automation, bank reconciliation (BRS) and contract drafting for Indian SMBs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "rapidfuzz>=3.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "docling>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
